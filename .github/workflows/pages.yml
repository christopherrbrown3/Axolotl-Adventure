name: Publish to GitHub Pages

# Copies the game files from main into the gh-pages branch, which GitHub Pages serves at
# https://axolotl.christopherbrown.ai (the domain comes from the CNAME file).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect site files
        run: |
          mkdir _site
          cp -r CNAME index.html styles.css manifest.webmanifest sw.js js icons _site/
          touch _site/.nojekyll
          # New cache name per deploy so installed copies pick up the update.
          sed -i "s/const VERSION = 'axolotl-v1';/const VERSION = 'axolotl-${GITHUB_SHA::7}';/" _site/sw.js
      - name: Push to gh-pages
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
